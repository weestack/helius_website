<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Helius">
    <!--
      Compact variant of the window mark: no title-bar dots, larger prompt.
      Favicons render at 16-32px, where the dots of the full mark are under a
      pixel across and turn to smear. See logo-exploration/assets/ for both.
    -->
    <defs>
        <mask id="fav" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
            <rect x="0" y="0" width="128" height="128" fill="#fff"/>
            <g fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
                <path d="M33.52 40 59.92 64 33.52 88"/>
                <path d="M74.32 88h20.16"/>
            </g>
        </mask>
    </defs>
    <rect x="8" y="20" width="112" height="88" rx="14" fill="currentColor" mask="url(#fav)"/>
    <style>
        svg { color: #008541; }
        @media (prefers-color-scheme: dark) {
            svg { color: #4ade80; }
        }
    </style>
</svg>
