<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#121821"/>

  <!-- Faint grid, matching the grid treatment on the site. -->
  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#4ade80" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="18%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <mask id="win">
      <rect x="0" y="0" width="128" height="128" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M33.52 40 59.92 64 33.52 88"/>
        <path d="M74.32 88h20.16"/>
      </g>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Brand lockup: window mark + wordmark. -->
  <g transform="translate(88, 78) scale(0.5)">
    <rect x="8" y="20" width="112" height="88" rx="14" fill="#4ade80" mask="url(#win)"/>
  </g>
  <text x="156" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42"
        font-weight="600" letter-spacing="-1" fill="#eaeef4">Helius</text>

  <!-- Positioning. -->
  <text x="88" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="76"
        font-weight="700" letter-spacing="-2.5" fill="#eaeef4">Linux &amp; kernel</text>
  <text x="88" y="356" font-family="Inter, Helvetica, Arial, sans-serif" font-size="76"
        font-weight="700" letter-spacing="-2.5" fill="#4ade80">engineering.</text>

  <text x="88" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28"
        fill="#a9adb4">Rust and eBPF security · hardened fleets · performance</text>

  <!-- Evidence strip, same numbers as the hero. -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#4ade80" font-size="34" font-weight="500">
    <text x="88" y="530">100+</text>
    <text x="290" y="530">11</text>
    <text x="452" y="530">96</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#7b7f85" font-size="20">
    <text x="88" y="562">Linux servers</text>
    <text x="290" y="562">K8s clusters</text>
    <text x="452" y="562">CI pipelines</text>
  </g>

  <text x="1112" y="562" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="22" fill="#7b7f85">helius.dk</text>

  <rect x="0" y="618" width="1200" height="12" fill="#4ade80"/>
</svg>
